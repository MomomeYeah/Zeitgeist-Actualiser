[project]
name = "zeitgeist"
version = "0.1.0"
description = "Finds what the internet is talking about and makes memes about it."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "httpx>=0.28",
    "pillow>=11.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
zeitgeist = "zeitgeist.serve:main"

[dependency-groups]
# ty is pre-1.0 and its rule defaults shift between releases; the upper bound
# plus uv.lock makes a version change a deliberate, reviewable act rather
# than something a routine `uv sync` can spring on a green tree.
dev = ["pytest>=8.3", "ruff>=0.8", "ty>=0.0.73,<0.1"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zeitgeist"
# uv_build assumes a src/ layout by default; this project is flat, so the
# module root is the project root. Omitting this fails the build with
# "expected module at src/zeitgeist".
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
# docs/ holds the plan and design-spec Markdown that later tasks' briefs are
# mechanically extracted from. ruff's formatter rewrites fenced Python code
# blocks in Markdown by default, which would silently alter those briefs.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 otherwise flags FastAPI's own idiom for declaring a dependency: the
# call in the default position is how FastAPI recognises it, not a mutable
# default evaluated once. This is ruff's own documented fix for it.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "zeitgeist.progress.NullObserver",
]

[tool.ty.rules]
# ty ships this rule disabled by default, citing false-positive volume.
# Enabling it adds zero findings to this codebase and closes the one gap
# Pylance covered that ty otherwise would not. See the design spec.
possibly-unresolved-reference = "error"
