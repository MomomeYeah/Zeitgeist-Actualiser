name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails rather than silently relocking when uv.lock has
      # drifted from pyproject.toml. That is what makes the pinned pre-1.0
      # ty version a real guarantee: CI runs the editor's build, or it fails.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` rather than `install`: it installs exactly what the lockfile
      # says and fails when package.json has drifted from it, which is the
      # same guarantee `uv sync --locked` gives on the Python side.
      - run: npm --prefix web ci

      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
